version: '3.8'

services:
  postgres-dwh:
    image: postgres:16-alpine
    container_name: mental_health_dwh_db
    restart: always
    environment:
      POSTGRES_DB: mental_health_dwh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./sql/00_init_db.sql:/docker-entrypoint-initdb.d/00_init_db.sql
    networks:
      - dwh_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mental_health_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-dwh
    networks:
      - dwh_network

networks:
  dwh_network:
    driver: bridge

volumes:
  postgres_dwh_data:
